<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CloudOS — New Tab</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }
      #app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      #frame-host {
        flex: 1 1 auto;
        min-height: 0;
      }
      #frame-host iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .setup {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .setup-card {
        max-width: 520px;
        width: 100%;
        padding: 32px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.85);
        box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.6);
      }
      .setup-card h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .setup-card p {
        margin: 0 0 20px;
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.55;
      }
      .setup-card label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #94a3b8;
        margin-bottom: 6px;
      }
      .setup-card input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.6);
        color: inherit;
        font-size: 14px;
      }
      .setup-card input:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      }
      .setup-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .setup-actions button {
        flex: 1 1 auto;
        padding: 10px 14px;
        border-radius: 8px;
        border: 0;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .setup-actions .primary {
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        color: #0f172a;
      }
      .setup-actions .secondary {
        background: rgba(148, 163, 184, 0.15);
        color: #e2e8f0;
      }
      .error {
        margin-top: 12px;
        font-size: 13px;
        color: #f87171;
      }
      .hint {
        margin-top: 12px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
