<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-label="CloudOS browser extension">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>
  <!-- subtle dot grid in lower-right corner -->
  <g fill="#1e293b" opacity="0.6">
    <circle cx="350" cy="220" r="2"/>
    <circle cx="365" cy="220" r="2"/>
    <circle cx="380" cy="220" r="2"/>
    <circle cx="395" cy="220" r="2"/>
    <circle cx="410" cy="220" r="2"/>
    <circle cx="350" cy="235" r="2"/>
    <circle cx="365" cy="235" r="2"/>
    <circle cx="380" cy="235" r="2"/>
    <circle cx="395" cy="235" r="2"/>
    <circle cx="410" cy="235" r="2"/>
    <circle cx="350" cy="250" r="2"/>
    <circle cx="365" cy="250" r="2"/>
    <circle cx="380" cy="250" r="2"/>
    <circle cx="395" cy="250" r="2"/>
    <circle cx="410" cy="250" r="2"/>
  </g>
  <!-- icon, scaled from 192 → 140 -->
  <g transform="translate(36, 70)">
    <rect width="140" height="140" rx="26" fill="#0f172a" stroke="url(#g)" stroke-width="3"/>
    <circle cx="70" cy="56" r="25" fill="url(#g)"/>
    <rect x="30" y="86" width="80" height="5" rx="2.5" fill="url(#g)"/>
    <rect x="30" y="96" width="58" height="5" rx="2.5" fill="url(#g)" opacity="0.7"/>
    <rect x="30" y="106" width="42" height="5" rx="2.5" fill="url(#g)" opacity="0.5"/>
  </g>
  <!-- text -->
  <text x="200" y="118" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="#e2e8f0">CloudOS</text>
  <text x="200" y="148" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Your desktop, every new tab.</text>
  <text x="200" y="186" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#64748b">Open-source · self-hostable · MV3</text>
</svg>
