server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ========== SECURITY HEADERS ==========
    
    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Strict referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Control browser features
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # Force HTTPS (if behind reverse proxy with SSL termination)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========== CONTENT SECURITY POLICY ==========
    add_header X-Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.open-meteo.com; frame-ancestors 'none';" always;

    # ========== CACHE CONTROL (Cache Busting) ==========
    
    # Static assets with hash - cache forever
    location ~* \.[0-9a-f]{8}\.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images and media - cache long
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|webm|mp4)$ {
        expires 6m;
        add_header Cache-Control "public, max-age=15552000";
        access_log off;
    }

    # HTML - NEVER cache (always fresh)
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Root and SPA - no cache
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========== API PROXY ==========
    
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # No caching for API
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        
        # Rate limiting headers (backend should handle actual limiting)
        add_header X-RateLimit-Limit "1000";
        add_header X-RateLimit-Remaining "999";
    }

    # ========== WEBSOCKET ==========
    
    location /ws {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========== COMPRESSION ==========
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/wasm;
    gzip_min_length 256;
    gzip_disable "msie6";

    # ========== BLOCKING ==========
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf|bak|backup|config|secret|password)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~* \.(bak|bkp|old|orig|original|saved)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to debug/log endpoints (except /health for docker healthcheck)
    location ~* ^/(debug|trace|logs?|status|prometheus)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========== SIZE LIMITS ==========
    
    client_max_body_size 10M;
    client_body_buffer_size 1M;
    
    # Limit request line length
    large_client_header_buffers 4 8k;
    
    # Timeout settings
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
}
