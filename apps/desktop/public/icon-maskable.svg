<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="CloudOS">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Maskable icons need their important content in the inner safe zone
       (~80% of the canvas). We expand the background to fill bleed area. -->
  <rect width="192" height="192" fill="#0f172a"/>
  <circle cx="96" cy="84" r="30" fill="url(#g)"/>
  <rect x="56" y="120" width="80" height="6" rx="3" fill="url(#g)"/>
  <rect x="56" y="132" width="56" height="6" rx="3" fill="url(#g)" opacity="0.7"/>
</svg>
